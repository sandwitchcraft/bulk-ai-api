[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-ai"
version = "0.1.0"
description = "Interactive terminal tool for running bulk prompts from a CSV against many LLM providers, with resumable projects."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "rich>=13",
    "questionary>=2.0",
    "keyring>=23",
]

[project.scripts]
bulk-ai = "bulk_ai.__main__:main"

[tool.setuptools]
packages = ["bulk_ai"]
